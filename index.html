<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racetrack Featured Schedule Builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body {
            padding: 2rem 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            margin-bottom: 0.5rem;
        }
        
        .file-input-wrapper {
            position: relative;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: block;
            padding: 0.75rem;
            background: var(--pico-background-color);
            border: 2px dashed var(--pico-primary);
            border-radius: var(--pico-border-radius);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-input-label:hover {
            background: var(--pico-primary-hover);
            border-color: var(--pico-primary-focus);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            text-align: center;
            padding: 1.5rem;
            background: var(--pico-primary);
            color: white;
            border-radius: var(--pico-border-radius);
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        
        .stat-card .label {
            font-size: 0.875rem;
            opacity: 0.9;
        }
        
        .track-slot {
            display: grid;
            grid-template-columns: 100px 200px 1fr 150px;
            gap: 1rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: var(--pico-card-background-color);
            border-left: 4px solid var(--pico-primary);
            border-radius: var(--pico-border-radius);
            align-items: center;
        }
        
        .slot-number {
            font-weight: bold;
            font-size: 1.125rem;
            color: var(--pico-primary);
        }
        
        .track-name {
            font-weight: 600;
        }
        
        .track-time {
            color: var(--pico-muted-color);
            font-size: 0.875rem;
        }
        
        .track-handle {
            text-align: right;
            font-weight: 200;
            color: var(--pico-ins-color);
        }
        
        @media (max-width: 768px) {
            .track-slot {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .track-handle {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>🏇📅  Top Tracks Schedule Builder</h1>
            <p>Optimized lineup for maximum engagement</p>
        </div>
        
        <article>
            <header>
                <strong>Input:</strong>
            </header>
            
            <div class="grid">
                <div>
                    <label for="csvFile">Upload CSV File:</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="csvFile" accept=".csv">
                        <label for="csvFile" class="file-input-label">
                            <span id="fileName">📁 Choose file...</span>
                        </label>
                    </div>
                </div>
                
                <div>
                    <label for="startTime">Schedule Start Time:</label>
                    <select id="startTime">
                        <option value="00:00">12:00 AM</option>
                        <option value="00:30">12:30 AM</option>
                        <option value="01:00">1:00 AM</option>
                        <option value="01:30">1:30 AM</option>
                        <option value="02:00" selected>2:00 AM</option>
                        <option value="02:30">2:30 AM</option>
                        <option value="03:00">3:00 AM</option>
                        <option value="03:30">3:30 AM</option>
                        <option value="04:00">4:00 AM</option>
                        <option value="04:30">4:30 AM</option>
                        <option value="05:00">5:00 AM</option>
                        <option value="05:30">5:30 AM</option>
                        <option value="06:00">6:00 AM</option>
                    </select>
                </div>
                
                <div>
                    <label for="endTime">Schedule End Time (Next Day):</label>
                    <select id="endTime">
                        <option value="00:00">12:00 AM</option>
                        <option value="00:30">12:30 AM</option>
                        <option value="01:00">1:00 AM</option>
                        <option value="01:30">1:30 AM</option>
                        <option value="02:00" selected>2:00 AM</option>
                        <option value="02:30">2:30 AM</option>
                        <option value="03:00">3:00 AM</option>
                    </select>
                </div>
            </div>
            <details>
            <summary>Options: </summary>
            <!-- <h4>Matching Threshold:</h4> -->
            <label>
                Required Tracks:
                <textarea placeholder="track codes that must always be set to active" id="inputAlwaysEnableTrackCodes" rows="5">CD
AQU
BEL</textarea>
            </label>
            <!-- <textarea placeholder="" id="inputText2"></textarea> -->
        </details>
            <button onclick="generateSchedule()">🎯 Generate Schedule</button>
        </article>
        
        <div id="results" style="display: none;">
            <div class="stats">
                <div class="stat-card">
                    <div class="value" id="totalTracks">0</div>
                    <div class="label">Total Active Tracks</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="scheduledTracks">0</div>
                    <div class="label">Scheduled Tracks</div>
                </div>
            </div>
            
            <article>
                <header>
                    <strong>Output:</strong>
                </header>
                <div id="scheduleOutput"></div>
                <footer>
                    <button onclick="downloadCSV()" class="secondary">📥 Download Schedule as CSV</button>
                </footer>
            </article>
        </div>
    </main>
    
<script>
    // Global variable to store the current schedule
    let currentSchedule = [];
    // *** PRIORITY THRESHOLD: Tracks with handle >= this amount will be chosen earlier ***
    const HIGH_PRIORITY_HANDLE_THRESHOLD = 400000;
    
    // Update file name display
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const fileName = e.target.files[0]?.name || 'Choose file...';
        document.getElementById('fileName').textContent = '📁 ' + fileName;
    });
    
    // Parse CSV file
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        
        return lines.slice(1).map(line => {
            // Handle quoted values that may contain commas
            const values = [];
            let currentValue = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(currentValue.trim().replace(/^"|"$/g, ''));
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            values.push(currentValue.trim().replace(/^"|"$/g, ''));
            
            const row = {};
            headers.forEach((header, index) => {
                row[header] = values[index] || '';
            });
            return row;
        });
    }
    
    // Get required track codes from textarea
    function getRequiredTrackCodes() {
        const textarea = document.getElementById('inputAlwaysEnableTrackCodes');
        if (!textarea || !textarea.value.trim()) {
            return [];
        }
        
        // Split by newlines and filter out empty strings
        return textarea.value
            .split('\n')
            .map(code => code.trim().toUpperCase())
            .filter(code => code.length > 0);
    }
    
    // Parse handle from string to number
    function parseHandle(handleStr) {
        if (!handleStr) return 0;
        return parseFloat(handleStr.replace(/[$,]/g, '')) || 0;
    }
    
    // Round time to nearest 15 minutes
    function roundToQuarter(date) {
        const minutes = date.getMinutes();
        const roundedMinutes = Math.round(minutes / 15) * 15;
        date.setMinutes(roundedMinutes);
        date.setSeconds(0);
        date.setMilliseconds(0);
        return date;
    }
    
    // Format time for display
    function formatTime(date) {
        return date.toLocaleTimeString('en-US', { 
            hour: 'numeric', 
            minute: '2-digit',
            hour12: true 
        });
    }
    
    // Format date and time
    function formatDateTime(date) {
        return date.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
    }
    
    // Format datetime for CSV (ISO format)
    function formatDateTimeForCSV(date) {
        return date.toISOString();
    }
    
    // Download schedule as CSV
    function downloadCSV() {
        if (currentSchedule.length === 0) {
            alert('No schedule to download!');
            return;
        }
        
        // Create CSV content
        let csvContent = 'Slot,Track Name,Track Code,Start Time,End Time,Duration (minutes),Handle\n';
        
        currentSchedule.forEach(item => {
            const duration = Math.round((item.end - item.start) / (1000 * 60));
            const row = [
                item.slot,
                `"${item.track.name}"`,
                item.track.code,
                formatDateTimeForCSV(item.start),
                formatDateTimeForCSV(item.end),
                duration,
                item.track.handle.toFixed(2)
            ].join(',');
            csvContent += row + '\n';
        });
        
        // Create blob and download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `racetrack_schedule_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    // Main scheduling algorithm
    function generateSchedule() {
        const fileInput = document.getElementById('csvFile');
        const startTimeStr = document.getElementById('startTime').value;
        const endTimeStr = document.getElementById('endTime').value;
        
        if (!fileInput.files[0]) {
            alert('Please upload a CSV file first!');
            return;
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const csvData = parseCSV(e.target.result);
                processSchedule(csvData, startTimeStr, endTimeStr);
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <article style="background: var(--pico-del-color); color: white;">
                        <p>Error parsing CSV: ${error.message}</p>
                    </article>
                `;
                document.getElementById('results').style.display = 'block';
            }
        };
        reader.readAsText(fileInput.files[0]);
    }
    
    function processSchedule(data, startTimeStr, endTimeStr) {
        // Get required track codes
        const requiredTrackCodes = getRequiredTrackCodes();
        
        // Filter tracks - either marked as enabled OR in the required list
        const activeTracks = data.filter(track => {
            const isEnabled = track['Active'] && track['Active'].toLowerCase() === 'enabled';
            const trackCode = (track['TVG Track Code'] || '').trim().toUpperCase();
            const isRequired = requiredTrackCodes.includes(trackCode);
            
            return isEnabled || isRequired;
        });
        
        if (activeTracks.length === 0) {
            document.getElementById('results').innerHTML = `
                <article style="background: var(--pico-del-color); color: white;">
                    <p>No active tracks found in the CSV file!</p>
                </article>
            `;
            document.getElementById('results').style.display = 'block';
            return;
        }
        
        // Parse and score tracks
        const tracks = activeTracks.map(track => {
            const handle = parseHandle(track['Handle']);
            const earliestStart = new Date(track['Earliest Start Time']);
            const lastPost = new Date(track['Last Post Start Date Time']);
            
            return {
                name: track['TVG Track Name'],
                code: track['TVG Track Code'],
                earliestStart: earliestStart,
                lastPost: lastPost,
                handle: handle,
                score: handle,
                isOnTV: track['Is On TV'] === '1',
                isHighPriority: handle >= HIGH_PRIORITY_HANDLE_THRESHOLD
            };
        }).filter(track => 
            !isNaN(track.earliestStart.getTime()) && 
            !isNaN(track.lastPost.getTime())
        );
        
        // Set up schedule boundaries for score calculation
        const referenceDate = tracks[0].earliestStart;
        const scheduleStart = new Date(referenceDate);
        const [startHour, startMinute] = startTimeStr.split(':').map(Number);
        scheduleStart.setHours(startHour, startMinute, 0, 0);
        
        // *** COMPOSITE SCORING: High priority tracks = pure handle, low priority = handle + time bonus ***
        tracks.forEach(track => {
            if (track.isHighPriority) {
                // High handle tracks: score based purely on handle
                track.score = track.handle;
            } else {
                // Lower handle tracks: bonus for starting earlier
                // Calculate hours from schedule start
                const hoursFromStart = (track.earliestStart - scheduleStart) / (1000 * 60 * 60);
                
                // Give earlier tracks a bonus (subtract penalty for later tracks)
                // This makes tracks starting at 3:40 AM score higher than those at noon
                const timeBonus = Math.max(0, 100000 - (hoursFromStart * 10000));
                track.score = track.handle + timeBonus;
            }
        });
        
        // Sort by composite score - highest first
        tracks.sort((a, b) => b.score - a.score);
        
        const scheduleEnd = new Date(scheduleStart);
        scheduleEnd.setDate(scheduleEnd.getDate() + 1);
        const [endHour, endMinute] = endTimeStr.split(':').map(Number);
        scheduleEnd.setHours(endHour, endMinute, 0, 0);
        
        // *** ARRAY OF AVAILABLE START TIMES - ALL INITIALIZED TO 2:00 AM (scheduleStart) ***
        const NUM_SLOTS = 6;
        const slotAvailableStartTimes = Array(NUM_SLOTS).fill(null).map(() => new Date(scheduleStart));
        
        // Schedule result
        const schedule = [];
        
        // Process each track in priority order (highest score first)
        for (const track of tracks) {
            // Find the slot that becomes available earliest
            let earliestSlotIndex = 0;
            let earliestAvailableTime = slotAvailableStartTimes[0];
            
            for (let i = 1; i < NUM_SLOTS; i++) {
                if (slotAvailableStartTimes[i] < earliestAvailableTime) {
                    earliestAvailableTime = slotAvailableStartTimes[i];
                    earliestSlotIndex = i;
                }
            }
            
            // Track starts exactly when the slot becomes available
            let actualStart = new Date(earliestAvailableTime);
            
            // Calculate when this track ends (use its last post time)
            let actualEnd = new Date(track.lastPost);
            
            // Add buffer for high-scoring tracks (15 minutes for races running late)
            if (track.handle > 260000) {
                actualEnd.setMinutes(actualEnd.getMinutes() + 15);
            }
            
            // Round end time to nearest quarter hour
            actualEnd = roundToQuarter(actualEnd);
            
            // Trim if extends past schedule end
            if (actualEnd > scheduleEnd) {
                actualEnd = new Date(scheduleEnd);
            }
            
            // Make sure end is after start
            if (actualEnd <= actualStart) {
                actualEnd = new Date(actualStart);
                actualEnd.setMinutes(actualEnd.getMinutes() + 15);
            }
            
            // Update the array: this slot's next available start time is when this track ends
            slotAvailableStartTimes[earliestSlotIndex] = new Date(actualEnd);
            
            // Add to schedule
            schedule.push({
                slot: earliestSlotIndex + 1,
                track: track,
                start: actualStart,
                end: actualEnd
            });
        }
        
        // Sort schedule by start time, then by slot
        schedule.sort((a, b) => {
            if (a.start.getTime() !== b.start.getTime()) {
                return a.start - b.start;
            }
            return a.slot - b.slot;
        });
        
        // Store schedule globally for CSV export
        currentSchedule = schedule;
        
        // Display results
        displaySchedule(schedule, tracks);
    }
    
    function displaySchedule(schedule, tracks) {
        // Update stats
        document.getElementById('totalTracks').textContent = tracks.length;
        document.getElementById('scheduledTracks').textContent = schedule.length;
        
        // Build schedule HTML
        let scheduleHTML = '';
        schedule.forEach((item, index) => {
            const duration = (item.end - item.start) / (1000 * 60); // minutes
            scheduleHTML += `
                <div class="track-slot">
                    <div class="slot-number">${item.slot}</div>
                    <div class="track-name">${item.track.name}${item.track.isHighPriority ? ' ⭐' : ''}</div>
                    <div class="track-time">
                        ${formatDateTime(item.start)} - ${formatTime(item.end)}
                        <br><small>(${Math.round(duration)} min)</small>
                    </div>
                    <div class="track-handle">$${item.track.handle.toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}</div>
                </div>
            `;
        });
        
        document.getElementById('scheduleOutput').innerHTML = scheduleHTML;
        document.getElementById('results').style.display = 'block';
        
        // Scroll to results
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
</body>
</html>
